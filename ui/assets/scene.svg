<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- The Wizard's Locked Library — original illustration drawn in SVG for this project -->
  <defs>
    <pattern id="bricks" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="#2b211c"/>
      <path d="M0 0.5H80M0 20.5H80M40 0V20M0 20V40M80 20V40" stroke="#1a1310" stroke-width="2"/>
      <rect x="3" y="3" width="34" height="14" fill="#30251f" opacity=".6"/>
      <rect x="44" y="24" width="32" height="13" fill="#271e19" opacity=".7"/>
    </pattern>
    <pattern id="planks" width="120" height="40" patternUnits="userSpaceOnUse">
      <rect width="120" height="40" fill="#3a2716"/>
      <path d="M0 0.5H120M0 20.5H120M70 0V20M20 20V40" stroke="#24170c" stroke-width="2"/>
    </pattern>
    <linearGradient id="wood" x1="0" x2="1">
      <stop offset="0" stop-color="#4a2f18"/><stop offset=".5" stop-color="#6b4422"/><stop offset="1" stop-color="#3d2613"/>
    </linearGradient>
    <linearGradient id="darkwood" x1="0" x2="1">
      <stop offset="0" stop-color="#2e1c0e"/><stop offset=".5" stop-color="#4a2e16"/><stop offset="1" stop-color="#2a190c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dc8c"/><stop offset=".45" stop-color="#c9973a"/><stop offset="1" stop-color="#7a5418"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5a5550"/><stop offset="1" stop-color="#2c2926"/>
    </linearGradient>
    <radialGradient id="moonsky" cx=".5" cy=".3" r=".8">
      <stop offset="0" stop-color="#3b4f7a"/><stop offset="1" stop-color="#0d1426"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9cdf5" stop-opacity=".28"/><stop offset="1" stop-color="#b9cdf5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffcf6b" stop-opacity=".65"/><stop offset=".4" stop-color="#ff9a2e" stop-opacity=".22"/><stop offset="1" stop-color="#ff7a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame" cx=".5" cy=".7" r=".6">
      <stop offset="0" stop-color="#fff6c8"/><stop offset=".4" stop-color="#ffc040"/><stop offset="1" stop-color="#e2541b"/>
    </radialGradient>
    <radialGradient id="runeglow">
      <stop offset="0" stop-color="#7ef0ff" stop-opacity=".9"/><stop offset="1" stop-color="#7ef0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- wall and floor -->
  <rect width="1200" height="330" fill="url(#bricks)"/>
  <rect y="330" width="1200" height="70" fill="url(#planks)"/>
  <rect y="326" width="1200" height="8" fill="#1c120a"/>

  <!-- arched moonlit window -->
  <g transform="translate(560 20)">
    <path d="M0 110V40A40 40 0 0 1 80 40V110Z" fill="url(#moonsky)" stroke="#1a1310" stroke-width="8"/>
    <circle cx="54" cy="36" r="13" fill="#f3efd6"/><circle cx="60" cy="31" r="12" fill="#2f4069"/>
    <circle cx="20" cy="28" r="1.6" fill="#fff"/><circle cx="30" cy="70" r="1.2" fill="#fff"/><circle cx="62" cy="80" r="1.4" fill="#fff"/>
    <path d="M40 0V110M0 60H80" stroke="#1a1310" stroke-width="5"/>
  </g>
  <polygon points="565,130 635,130 760,330 470,330" fill="url(#beam)"/>

  <!-- wall torches -->
  <g id="torch">
    <circle cx="360" cy="120" r="80" fill="url(#glow)"/>
    <path d="M352 140h16l-4 30h-8z" fill="#3b2a1c"/>
    <rect x="348" y="134" width="24" height="8" rx="2" fill="url(#iron)"/>
    <path d="M360 96c10 12 12 22 6 32-3 5-9 6-12 6-6-1-11-7-9-15 2-6 5-6 6-12 2 4 4 5 6 3 2-4 1-9 3-14z" fill="url(#flame)"/>
  </g>
  <use href="#torch" x="600"/>

  <!-- bookshelf -->
  <g>
    <rect x="50" y="60" width="270" height="272" fill="url(#darkwood)" stroke="#1a0f06" stroke-width="4"/>
    <rect x="62" y="72" width="246" height="252" fill="#170e07"/>
    <g fill="url(#wood)">
      <rect x="58" y="128" width="254" height="10"/><rect x="58" y="192" width="254" height="10"/><rect x="58" y="258" width="254" height="10"/>
      <rect x="44" y="52" width="282" height="14"/>
    </g>
    <!-- row 1 -->
    <g>
      <rect x="66" y="84" width="14" height="44" fill="#5b3a2a"/><rect x="81" y="90" width="12" height="38" fill="#384a3a"/>
      <rect x="94" y="80" width="16" height="48" fill="#6b5236"/><rect x="111" y="88" width="10" height="40" fill="#45303f"/>
      <rect x="122" y="84" width="14" height="44" fill="#2e3c55"/>
      <rect x="140" y="98" width="40" height="30" fill="#5a3d26" transform="rotate(-8 160 128)"/>
      <rect x="190" y="86" width="13" height="42" fill="#4d4030"/><rect x="204" y="82" width="15" height="46" fill="#6b2f2a"/>
      <rect x="220" y="90" width="11" height="38" fill="#384a3a"/><rect x="232" y="84" width="16" height="44" fill="#5b4a2e"/>
      <circle cx="285" cy="112" r="16" fill="#c9c2a8" opacity=".9"/><rect x="275" y="122" width="20" height="6" fill="#8a7a5a"/>
    </g>
    <!-- row 2 with the three marked books -->
    <g>
      <rect x="66" y="150" width="15" height="42" fill="#4a3826"/><rect x="82" y="146" width="12" height="46" fill="#3b2f3f"/>
      <rect x="95" y="152" width="14" height="40" fill="#5b4a2e"/>
      <rect x="114" y="142" width="20" height="50" fill="#2f7a46" stroke="#e8c76a" stroke-width="1.5"/>
      <rect x="118" y="150" width="12" height="4" fill="#e8c76a"/>
      <rect x="136" y="150" width="12" height="42" fill="#4d4030"/><rect x="149" y="146" width="14" height="46" fill="#3a3326"/>
      <rect x="168" y="140" width="20" height="52" fill="#a8302b" stroke="#e8c76a" stroke-width="1.5"/>
      <rect x="172" y="148" width="12" height="4" fill="#e8c76a"/>
      <rect x="190" y="150" width="13" height="42" fill="#5b3a2a"/><rect x="204" y="152" width="11" height="40" fill="#384a3a"/>
      <rect x="220" y="143" width="20" height="49" fill="#2c5aa6" stroke="#e8c76a" stroke-width="1.5"/>
      <rect x="224" y="151" width="12" height="4" fill="#e8c76a"/>
      <rect x="242" y="148" width="14" height="44" fill="#6b5236"/><rect x="257" y="152" width="12" height="40" fill="#45303f"/>
      <rect x="270" y="146" width="16" height="46" fill="#4a3826"/>
    </g>
    <!-- row 3 -->
    <g>
      <rect x="66" y="214" width="16" height="44" fill="#45303f"/><rect x="83" y="218" width="12" height="40" fill="#5b4a2e"/>
      <rect x="96" y="210" width="15" height="48" fill="#2e3c55"/><rect x="112" y="216" width="13" height="42" fill="#6b2f2a"/>
      <path d="M140 258l18-46 12 5-18 41z" fill="#4d4030"/>
      <rect x="176" y="216" width="14" height="42" fill="#384a3a"/><rect x="191" y="212" width="16" height="46" fill="#5a3d26"/>
      <rect x="208" y="220" width="11" height="38" fill="#3a3326"/>
      <rect x="236" y="240" width="56" height="9" fill="#6b5236"/><rect x="240" y="231" width="50" height="9" fill="#2f4a55"/><rect x="234" y="249" width="60" height="9" fill="#5b3a2a"/>
    </g>
    <!-- row 4 scrolls -->
    <g fill="#d8c8a0" stroke="#7a6440" stroke-width="1.5">
      <rect x="72" y="296" width="60" height="14" rx="7"/><rect x="80" y="282" width="56" height="14" rx="7"/>
      <rect x="150" y="296" width="62" height="14" rx="7"/>
    </g>
    <path d="M230 320c0-24 20-40 34-40s32 16 32 40z" fill="#3a2716"/><circle cx="263" cy="300" r="7" fill="#d9a94a" opacity=".7"/>
  </g>

  <!-- painting -->
  <g>
    <rect x="378" y="96" width="166" height="124" fill="url(#gold)" rx="4"/>
    <rect x="390" y="108" width="142" height="100" fill="#2b2a3a"/>
    <rect x="390" y="168" width="142" height="40" fill="#3a2e22"/>
    <g>
      <circle cx="420" cy="138" r="9" fill="#d9b48a"/><path d="M405 200c0-30 6-46 15-50 9 4 15 20 15 50z" fill="#4b2d5a"/>
      <rect x="412" y="158" width="16" height="12" fill="#c0322d" stroke="#2a1a10"/>
      <circle cx="461" cy="134" r="9" fill="#cfa77c"/><path d="M446 200c0-32 6-48 15-52 9 4 15 20 15 52z" fill="#5a4a2a"/>
      <rect x="453" y="155" width="16" height="12" fill="#2c5aa6" stroke="#2a1a10"/>
      <circle cx="502" cy="138" r="9" fill="#d9b48a"/><path d="M487 200c0-30 6-46 15-50 9 4 15 20 15 50z" fill="#28465a"/>
      <rect x="494" y="158" width="16" height="12" fill="#2f7a46" stroke="#2a1a10"/>
    </g>
    <rect x="390" y="108" width="142" height="100" fill="none" stroke="#1a1208" stroke-width="2"/>
  </g>

  <!-- grandfather clock -->
  <g>
    <path d="M690 330V128h-6v-14l40-22 40 22v14h-6v202z" fill="url(#darkwood)" stroke="#170d05" stroke-width="3"/>
    <circle cx="724" cy="140" r="26" fill="url(#gold)"/>
    <circle cx="724" cy="140" r="21" fill="#efe4c4"/>
    <g stroke="#3a2a14" stroke-width="2">
      <path d="M724 122v4M724 154v4M706 140h4M738 140h4"/>
    </g>
    <g stroke="#1e140a" stroke-linecap="round">
      <line x1="724" y1="140" x2="724" y2="128" stroke-width="3" transform="rotate(277.5 724 140)"/>
      <line x1="724" y1="140" x2="724" y2="123" stroke-width="2" transform="rotate(90 724 140)"/>
    </g>
    <circle cx="724" cy="140" r="2.5" fill="#1e140a"/>
    <rect x="704" y="180" width="40" height="110" rx="20" fill="#120b05"/>
    <line x1="724" y1="184" x2="724" y2="262" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="724" cy="266" r="11" fill="url(#gold)"/>
    <rect x="708" y="296" width="32" height="8" fill="url(#gold)" opacity=".9"/>
  </g>

  <!-- rug -->
  <ellipse cx="560" cy="368" rx="170" ry="22" fill="#5a1f22"/>
  <ellipse cx="560" cy="368" rx="150" ry="16" fill="none" stroke="#c9973a" stroke-width="2" stroke-dasharray="8 6"/>
  <ellipse cx="560" cy="368" rx="60" ry="7" fill="#3a1416"/>

  <!-- desk with candle and note -->
  <g>
    <rect x="790" y="250" width="200" height="14" fill="url(#wood)" stroke="#1a0f06" stroke-width="2"/>
    <rect x="800" y="264" width="18" height="70" fill="url(#darkwood)"/><rect x="962" y="264" width="18" height="70" fill="url(#darkwood)"/>
    <rect x="830" y="266" width="120" height="30" fill="url(#darkwood)" stroke="#1a0f06" stroke-width="2"/>
    <rect x="882" y="276" width="16" height="12" rx="2" fill="url(#gold)"/>
    <circle cx="890" cy="282" r="2" fill="#2a1a08"/>
    <path d="M840 248l40-6 8 6-44 6z" fill="#e8dcb8" stroke="#8a7550" stroke-width="1"/>
    <circle cx="950" cy="230" r="60" fill="url(#glow)"/>
    <rect x="944" y="222" width="12" height="28" fill="#efe6cc"/>
    <path d="M950 202c6 7 7 13 3 18-2 2-5 2-6 0-3-4 0-10 3-18z" fill="url(#flame)"/>
    <ellipse cx="950" cy="250" rx="16" ry="4" fill="url(#gold)"/>
  </g>

  <!-- rune door -->
  <g>
    <path d="M1030 330V140a75 75 0 0 1 150 0V330z" fill="#1a120c"/>
    <path d="M1040 330V142a65 65 0 0 1 130 0V330z" fill="url(#wood)"/>
    <g stroke="#2a1a0c" stroke-width="2"><path d="M1072 80V330M1105 77V330M1138 80V330"/></g>
    <g fill="url(#iron)">
      <rect x="1040" y="150" width="130" height="12"/><rect x="1040" y="290" width="130" height="12"/>
    </g>
    <g fill="#8a8580"><circle cx="1050" cy="156" r="3"/><circle cx="1160" cy="156" r="3"/><circle cx="1050" cy="296" r="3"/><circle cx="1160" cy="296" r="3"/></g>
    <circle cx="1105" cy="225" r="34" fill="url(#runeglow)" opacity=".55"/>
    <rect x="1077" y="208" width="56" height="34" rx="4" fill="#211a14" stroke="url(#gold)" stroke-width="2"/>
    <g fill="#9ff4ff" font-family="Georgia, serif" font-size="13" text-anchor="middle">
      <text x="1088" y="230">ᚱ</text><text x="1100" y="230">ᚢ</text><text x="1112" y="230">ᚾ</text><text x="1124" y="230">ᛖ</text>
    </g>
    <circle cx="1150" cy="262" r="7" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <g fill="#7ef0ff" opacity=".7" font-family="Georgia, serif" font-size="14" text-anchor="middle">
      <text x="1105" y="120">ᛟ</text><text x="1060" y="190">ᚦ</text><text x="1150" y="190">ᛉ</text>
    </g>
  </g>

  <!-- dust motes in the moonbeam -->
  <g fill="#fff8e0" opacity=".55">
    <circle cx="600" cy="180" r="1.5"/><circle cx="640" cy="230" r="1"/><circle cx="580" cy="270" r="1.3"/>
    <circle cx="660" cy="290" r="1"/><circle cx="620" cy="150" r="1"/><circle cx="700" cy="250" r="1.4"/>
  </g>

  <rect width="1200" height="400" fill="url(#vignette)"/>
</svg>
